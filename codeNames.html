<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codenames: 3 Teams</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #setup {
      margin: 20px;
    }

    #game-board {
      display: grid;
      grid-template-rows: 50% 50%;
      gap: 20px;
      height: 100vh;
      margin: 0;
    }

    #upper-half {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin: 20px auto;
      max-width: 600px;
    }

    #lower-half {
      display: grid;
      grid-template-columns: 50% 50%;
      gap: 10px;
      margin-top: 20px;
    }

    .card {
      width: 100px;
      height: 50px;
      background-color: lightgray;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .card.revealed {
      cursor: default;
      background-color: white;
    }

    .card.red { background-color: red; color: white; }
    .card.blue { background-color: blue; color: white; }
    .card.green { background-color: green; color: white; }
    .card.beige { background-color: beige; color: black; }
    .card.bomb { background-color: black; color: white; }

    #spymaster-controls, #turn-controls {
      margin-top: 20px;
    }

    #team-info, #logs {
      padding: 10px;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      overflow-y: scroll;
    }

    /* Flashing and dimming effect for incorrect guesses */
    .flash-dim {
      animation: flash-dim 1s forwards;
    }

    @keyframes flash-dim {
      0% {
        background-color: lightgray;
      }
      50% {
        background-color: red;
        opacity: 0.5;
      }
      100% {
        background-color: lightgray;
        opacity: 1;
      }
    }

    body.red-turn { background-color: #D32F2F; color: white; }
    body.blue-turn { background-color: #2196F3; color: white; }
    body.green-turn { background-color: #4CAF50; color: white; }
    body.bomb-turn { background-color: black; color: white; }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      #upper-half {
        grid-template-columns: repeat(3, 1fr);
      }

      #lower-half {
        grid-template-columns: 1fr;
      }

      .card {
        width: 80px;
        height: 40px;
        font-size: 12px;
      }

      #team-info, #logs {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>Codenames: 3 Teams</h1>
  <div id="setup">
    <label>Enter Words (comma-separated):</label><br>
    <textarea id="words-input" rows="4" cols="50"></textarea><br><br>
    <button id="start-game">Start Game</button>
  </div>
  <div id="game-board" style="display: none;">
    <h3 id="turn-info"></h3>
    <div id="upper-half"></div>
    <div id="lower-half">
      <div id="team-info">
        <h4>Teams</h4>
        <p>Red: Spymaster, Agent 1, Agent 2</p>
        <p>Blue: Spymaster, Agent 1, Agent 2</p>
        <p>Green: Spymaster, Agent 1, Agent 2</p>
      </div>
      <div id="logs">
        <h4>Logs</h4>
        <ul id="log-list"></ul>
      </div>
    </div>
    <div id="spymaster-controls">
      <button id="reveal-board">Reveal Board (Spymaster)</button>
      <button id="hide-board" style="display: none;">Hide Board</button>
    </div>
    <div id="turn-controls">
      <input type="text" id="hint" placeholder="Spymaster's hint">
      <input type="number" id="num-words" placeholder="Number of words">
      <button id="submit-hint">Submit Hint</button>
      <button id="end-guess" style="display: none;">End Guess</button>
    </div>
    <div id="hint-display" style="margin-top: 20px; font-weight: bold;"></div>
  </div>

  <script>
    const setupDiv = document.getElementById('setup');
    const gameBoardDiv = document.getElementById('game-board');
    const boardDiv = document.getElementById('upper-half');
    const turnInfo = document.getElementById('turn-info');
    const revealBoardBtn = document.getElementById('reveal-board');
    const hideBoardBtn = document.getElementById('hide-board');
    const hintInput = document.getElementById('hint');
    const numWordsInput = document.getElementById('num-words');
    const submitHintBtn = document.getElementById('submit-hint');
    const endGuessBtn = document.getElementById('end-guess')
    const logList = document.getElementById('log-list');

    let words = [];
    let assignments = {};
    let currentTeam = 0; // 0 = Red, 1 = Blue, 2 = Green
    const teams = ['Red', 'Blue', 'Green'];
    let currentHint = '';
    let currentNumWords = 0;

    let hintGiven = false; 
    let guessesLeft = 0; 
    let redRemaining = 8;  
    let blueRemaining = 8;  
    let greenRemaining = 8;  

    // Function to update remaining words count
    function updateRemainingWords() {
      // Here, you can add or modify how remaining words are displayed
    }

    function updateTurnInfo(given, guessesLeft, bomb=false) {
      hintGiven = given;
      turnInfo.innerText = hintGiven
        ? `${teams[currentTeam]}, make your guesses! (${guessesLeft} guesses remaining)`
        : `It's ${teams[currentTeam]}'s turn! Spymaster, provide your hint.`;
    }

    function renderBoard() {
      const allWords = [
        ...assignments.red.map(w => ({ word: w, color: 'red' })),
        ...assignments.blue.map(w => ({ word: w, color: 'blue' })),
        ...assignments.green.map(w => ({ word: w, color: 'green' })),
        ...assignments.beige.map(w => ({ word: w, color: 'beige' })),
        { word: assignments.bomb, color: 'bomb' }
      ].sort(() => Math.random() - 0.5);

      boardDiv.innerHTML = '';
      allWords.forEach(({ word, color }) => {
        const card = document.createElement('div');
        card.className = `card`;
        card.innerText = word;
        card.dataset.color = color;
        card.addEventListener('click', () => {
          card.classList.add('revealed', color); 
        });
        boardDiv.appendChild(card);
      });
    }

    function setupGame() {
      assignments = assignWords(words);
      renderBoard();
      setupDiv.style.display = 'none';
      gameBoardDiv.style.display = 'block';
      updateTurnInfo();
    }

    document.getElementById('start-game').addEventListener('click', () => {
      words = document.getElementById('words-input').value.split(',').map(w => w.trim());
      if (words.length < 37) {
        alert("Enter at least 37 words.");
        return;
      }
      setupGame();
    });

    function assignWords(words) {
      const shuffled = [...words].sort(() => Math.random() - 0.5);
      return {
        bomb: shuffled[0],
        red: shuffled.slice(1, 9),
        blue: shuffled.slice(9, 17),
        green: shuffled.slice(17, 25),
        beige: shuffled.slice(25)
      };
    }

    revealBoardBtn.addEventListener('click', () => {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const color = card.dataset.color;
        card.classList.add(color);
      });
      revealBoardBtn.style.display = 'none';
      hideBoardBtn.style.display = 'inline';
    });

    hideBoardBtn.addEventListener('click', () => {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        card.classList.remove('red', 'blue', 'green', 'beige', 'bomb');
      });
      revealBoardBtn.style.display = 'inline';
      hideBoardBtn.style.display = 'none';
    });

    submitHintBtn.addEventListener('click', () => {
      currentHint = hintInput.value;
      currentNumWords = parseInt(numWordsInput.value);
      if (currentHint && currentNumWords) {
        updateTurnInfo(true, currentNumWords);
      }
    });

    endGuessBtn.addEventListener('click', () => {
      currentTeam = (currentTeam + 1) % 3;
      updateTurnInfo(false, currentNumWords);
    });
  </script>
</body>
</html>
