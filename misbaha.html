<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#000;
    font-family:Tahoma, Arial, sans-serif;
    padding:15px;
}

/* SCREEN */
.screen{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    width:95%;
    max-width:500px;
    height:35vh;
    background:#111;
    border-radius:15px;
    border:5px solid #00ff00;
    box-shadow:0 0 20px rgba(0,255,0,.7);
    padding:15px;
    margin-bottom:25px;
}

/* COUNTER */
.counter{
    font-size:72px;
    color:#00ff00;
    text-shadow:0 0 8px rgba(0,255,0,.8);
    letter-spacing:4px;
}

/* MESSAGE */
.message{
    font-size:18px;
    color:#00ff00;
    text-align:center;
    margin-top:10px;
    line-height:1.8;
    max-height:70px;
    overflow-y:auto;
    width:100%;
}

/* TOTAL */
.total{
    font-size:24px;
    color:#00ff00;
    margin-top:10px;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:15px;
    width:100%;
}

/* BUTTON STYLE */
button{
    border:none;
    border-radius:15px;
    background:#222;
    color:#00ff00;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 12px rgba(0,255,0,.7);
    transition:.2s;
}

button:active{
    transform:scale(.95);
}

/* PREV / NEXT */
#prevBtn,
#nextBtn{
    width:80px;
    height:80px;
    font-size:32px;
}

/* MAIN COUNT BUTTON */
#increaseBtn{
    width:130px;
    height:130px;
    font-size:56px;
}

/* RESET */
#resetBtn{
    width:80px;
    height:80px;
    font-size:28px;
}

@media (max-width:480px){

    .counter{
        font-size:60px;
    }

    .message{
        font-size:16px;
    }

    #increaseBtn{
        width:120px;
        height:120px;
    }

    #prevBtn,
    #nextBtn,
    #resetBtn{
        width:75px;
        height:75px;
    }
}
</style>
</head>

<body>

<div class="screen">
    <div class="counter" id="counter">000</div>
    <div class="message" id="message"></div>
    <div class="total" id="total"></div>
</div>

<div class="buttons">
    <button id="prevBtn">◀</button>
    <button id="increaseBtn">+</button>
    <button id="nextBtn">▶</button>
    <button id="resetBtn">↺</button>
</div>

<script>
let count = 0;
let currentMessageIndex = 0;

const messages = [
    { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", count: 100 },
    { text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", count: 100 },
    { text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ", count: 100 },
    { text: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", count: 10 },
    { text: "رَضِيتُ بِاللَّهِ رَبًّا", count: 3 }
];

const counterDisplay = document.getElementById("counter");
const messageDisplay = document.getElementById("message");
const totalDisplay = document.getElementById("total");

const increaseBtn = document.getElementById("increaseBtn");
const resetBtn = document.getElementById("resetBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function updateUI(){
    messageDisplay.textContent = messages[currentMessageIndex].text;
    totalDisplay.textContent =
        `الهدف: ${messages[currentMessageIndex].count}`;
}

function resetCounter(){
    count = 0;
    counterDisplay.textContent = "000";
}

updateUI();

/* COUNT */
increaseBtn.addEventListener("click", () => {

    count++;

    counterDisplay.textContent =
        count.toString().padStart(3,"0");

    if(count >= messages[currentMessageIndex].count){

        setTimeout(() => {

            currentMessageIndex =
                (currentMessageIndex + 1) % messages.length;

            resetCounter();
            updateUI();

        },300);
    }
});

/* RESET */
resetBtn.addEventListener("click", resetCounter);

/* NEXT */
nextBtn.addEventListener("click", () => {

    currentMessageIndex =
        (currentMessageIndex + 1) % messages.length;

    resetCounter();
    updateUI();
});

/* PREVIOUS */
prevBtn.addEventListener("click", () => {

    currentMessageIndex--;

    if(currentMessageIndex < 0){
        currentMessageIndex = messages.length - 1;
    }

    resetCounter();
    updateUI();
});
</script>

</body>
</html>
