<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>

<style>
body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #000;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
}

/* SCREEN */
.screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 85%;
    height: 50%;
    background: #111;
    border-radius: 15px;
    border: 5px solid #00ff00;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
    padding: 15px;
    margin-bottom: 25px;
}

/* COUNTER */
.counter {
    font-size: 72px;
    color: #00ff00;
    font-family: 'Tahoma', sans-serif;
    text-shadow: 0 0 5px rgba(0, 255, 0, 0.7);
    letter-spacing: 0.2em;
}

/* MESSAGE (SMALL + SCROLLABLE) */
.message {
    font-size: 14px;
    color: #00ff00;
    text-align: center;
    font-family: 'Tahoma', sans-serif;
    margin-top: 10px;
    line-height: 1.5;
    direction: rtl;
    max-height: 80px;
    overflow-y: auto;
    padding: 5px;
}

/* TOTAL */
.total {
    font-size: 24px;
    color: #00ff00;
    margin-top: 8px;
}

/* BUTTONS */
.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

/* DEFAULT BUTTON (RESET) */
button {
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: #00ff00;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0, 255, 0, 0.7);
}

button:hover {
    background-color: #333;
    transform: scale(1.05);
}

/* BIG MAIN BUTTON */
#increaseBtn {
    width: 110px;
    height: 110px;
    border-radius: 15px;
}

/* SMALL RESET */
#resetBtn {
    width: 55px;
    height: 55px;
    opacity: 0.8;
}

/* ICONS */
.icon {
    font-size: 28px;
}

#increaseBtn .icon {
    font-size: 48px;
}

#resetBtn .icon {
    font-size: 20px;
}
</style>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="screen">
    <div class="counter" id="counter">000</div>
    <div class="message" id="message"></div>
    <div class="total" id="total"></div>
</div>

<div class="buttons">
    <button id="increaseBtn">
        <i class="fas fa-plus icon"></i>
    </button>
    <button id="resetBtn">
        <i class="fas fa-redo icon"></i>
    </button>
</div>

<script>
let count = 0;
let currentMessageIndex = 0;

const messages = [
{ text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", count: 100 },
{ text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", count: 100 },
{ text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ", count: 100 },
{ text: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", count: 10 },
{ text: "رَضِيتُ بِاللَّهِ رَبًّا", count: 3 }
];

const counterDisplay = document.getElementById('counter');
const messageDisplay = document.getElementById('message');
const totalDisplay = document.getElementById('total');

const increaseBtn = document.getElementById('increaseBtn');
const resetBtn = document.getElementById('resetBtn');

/* INIT */
function updateUI() {
    messageDisplay.textContent = messages[currentMessageIndex].text;
    totalDisplay.textContent = "الهدف: " + messages[currentMessageIndex].count;
}
updateUI();

/* COUNT */
increaseBtn.addEventListener('click', () => {
    count++;
    counterDisplay.textContent = count.toString().padStart(3, '0');

    if (count >= messages[currentMessageIndex].count) {
        setTimeout(() => {
            count = 0;
            counterDisplay.textContent = "000";

            currentMessageIndex = (currentMessageIndex + 1) % messages.length;
            updateUI();
        }, 300);
    }
});

/* RESET */
resetBtn.addEventListener('click', () => {
    count = 0;
    counterDisplay.textContent = "000";
});
</script>

</body>
</html>
